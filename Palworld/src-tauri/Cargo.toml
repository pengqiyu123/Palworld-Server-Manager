[package]
name = "palworld-server-manager"
version = "1.0.1"
description = "Palworld Dedicated Server Management Tool"
authors = ["Palworld Server Manager"]
license = "GPL-3.0-or-later"
repository = "https://github.com/pengqiyu123/Palworld-Server-Manager"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gvas = "0.11"
flate2 = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
shell-escape = "0.1"
winreg = "0.52"
once_cell = "1"
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"

# T1：vendored Oodle(Kraken) 解码器（MIT，纯 Rust），用于解码 .sav 的 PlM 压缩。
# 源码见 crates/oozextract/，保留上游 LICENSE-MIT 以符合分发合规。
oozextract = { path = "crates/oozextract" }
