[package]
name = "palworld-server-manager"
version = "1.0.0"
description = "Palworld Dedicated Server Management Tool"
authors = ["Palworld Server Manager"]
license = "MIT"
repository = ""
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
shell-escape = "0.1"
winreg = "0.52"
once_cell = "1"
rcon = { version = "0.6", features = ["rt-tokio"] }
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }
reqwest = { version = "0.12", features = ["json"] }
